# Keeps pinned CI actions, packages and base images current. Updates arrive as pull requests that run the full CI.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: nuget
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule: { interval: weekly }
